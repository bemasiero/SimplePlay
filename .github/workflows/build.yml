name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk SimplePlay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SimplePlay-apk
          path: SimplePlay.apk
      # Stable direct link for TVs:
      # https://github.com/<owner>/<repo>/releases/latest/download/SimplePlay.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SimplePlay (latest build)
          body: "Direct download: https://github.com/${{ github.repository }}/releases/latest/download/SimplePlay.apk"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SimplePlay.apk
